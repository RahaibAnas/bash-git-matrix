<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dev Workspace Hub</title>
    <link rel="shortcut icon" href="OIP.webp" type="image/x-icon">
    <style>
        /* ----- CSS variables (light & dark) ----- */
        :root {
            /* light defaults */
            --bg: #f4f8fb;
            --card: #ffffff;
            --text: #122033;
            --muted: #64748b;
            --primary: #0db7ed;
            --primary-dark: #0796c4;
            --secondary: #123047;
            --border: #dbe7ef;
            --code-bg: #0f172a;
            --code-text: #d7f7ff;
            --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
            --radius: 18px;
            --badge-bg: #e8f7fd;
            --badge-text: var(--primary-dark);
            --copy-bg: #eef6fa;
            --copy-hover: var(--primary);
            --copy-text: var(--secondary);
            --option-bg: #f6fafc;
            --option-border: #e1edf4;
            --hero-bg: linear-gradient(135deg, #0f2d44, #0b5c7d 55%, #0db7ed);
            --hero-text: white;
            --hero-sub: rgba(255, 255, 255, 0.84);
            --search-bg: white;
            --search-text: var(--text);
            --clear-bg: var(--secondary);
            --clear-hover: #0b2235;
            --clear-text: white;
            --cat-btn-bg: #e7f4fa;
            --cat-btn-border: #c9e6f2;
            --cat-btn-hover: #d9f0f9;
            --cat-btn-active: var(--primary);
            --cat-btn-active-text: white;
            --card-border: var(--border);
            --card-hover-border: rgba(13, 183, 237, 0.48);
            --scroll-bg: var(--primary);
            --scroll-shadow: rgba(13, 183, 237, 0.35);
        }

        /* dark theme overrides */
        [data-theme="dark"] {
            --bg: #0b1420;
            --card: #1a2634;
            --text: #e6f1fc;
            --muted: #95aec9;
            --primary: #2bc9f7;
            --primary-dark: #5bd6ff;
            --secondary: #c1d9f0;
            --border: #2b3e54;
            --code-bg: #0b111e;
            --code-text: #c8ecff;
            --shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            --badge-bg: #1d3347;
            --badge-text: #7fd4ff;
            --copy-bg: #253545;
            --copy-hover: #2bc9f7;
            --copy-text: #d4e7fc;
            --option-bg: #1b2a3a;
            --option-border: #2e445c;
            --hero-bg: linear-gradient(135deg, #0d1f2e, #0b3852 55%, #1f8bb0);
            --hero-text: #f0faff;
            --hero-sub: #c5e2f5;
            --search-bg: #1a2634;
            --search-text: #e6f1fc;
            --clear-bg: #2b3e54;
            --clear-hover: #3e5877;
            --clear-text: white;
            --cat-btn-bg: #1f3143;
            --cat-btn-border: #334b64;
            --cat-btn-hover: #2b4057;
            --cat-btn-active: #2bc9f7;
            --cat-btn-active-text: #0b1420;
            --card-border: #2b3e54;
            --card-hover-border: #2bc9f7;
            --scroll-bg: #2bc9f7;
            --scroll-shadow: rgba(43, 201, 247, 0.35);
        }

        /* ----- reset & base ----- */
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(13, 183, 237, 0.16), transparent 34%),
                var(--bg);
            color: var(--text);
            transition: background 0.2s, color 0.2s;
        }

        /* ----- hero ----- */
        .hero {
            padding: 42px 20px 32px;
            background: var(--hero-bg);
            color: var(--hero-text);
            transition: background 0.2s;
        }

        .hero-content {
            max-width: 1150px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .logo {
            width: 66px;
            height: 66px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.16);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
            font-size: 34px;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        .hero p {
            margin: 10px 0 0;
            color: var(--hero-sub);
            font-size: 1.02rem;
        }

        /* ----- search & toolbar ----- */
        .search-box {
            max-width: 1150px;
            margin: 0 auto;
        }

        .search-box input {
            width: 100%;
            padding: 18px 20px;
            border: 0;
            border-radius: 999px;
            outline: none;
            font-size: 1rem;
            color: var(--search-text);
            background: var(--search-bg);
            box-shadow: var(--shadow);
            transition: background 0.2s, color 0.2s;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 28px 20px 70px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .toolbar h2 {
            margin: 0;
            font-size: 1.35rem;
        }

        .toolbar p {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .clear-btn {
            border: 0;
            cursor: pointer;
            font: inherit;
            padding: 10px 15px;
            border-radius: 999px;
            background: var(--clear-bg);
            color: var(--clear-text);
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: var(--clear-hover);
        }

        /* ----- category buttons ----- */
        .category-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 4px 0 22px;
            margin-bottom: 6px;
        }

        .category-btn {
            white-space: nowrap;
            padding: 10px 14px;
            border-radius: 999px;
            font: inherit;
            border: 1px solid var(--cat-btn-border);
            background: var(--cat-btn-bg);
            color: var(--secondary);
            transition: 0.2s ease;
            cursor: pointer;
        }

        .category-btn:hover {
            transform: translateY(-1px);
            background: var(--cat-btn-hover);
        }

        .category-btn.active {
            background: var(--cat-btn-active);
            color: var(--cat-btn-active-text);
            border-color: var(--cat-btn-active);
            box-shadow: 0 10px 20px rgba(13, 183, 237, 0.22);
        }

        /* ----- command grid ----- */
        .commands-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin: 0 auto;
        }

        .command-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: 0.2s ease;
            min-width: 0;
            width: 100%;
        }

        .command-card:hover {
            transform: translateY(-3px);
            border-color: var(--card-hover-border);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-flex;
            width: fit-content;
            padding: 5px 9px;
            border-radius: 999px;
            background: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.76rem;
            font-weight: 700;
        }

        .command-card h3 {
            margin: 9px 0 0;
            font-size: 1.08rem;
            letter-spacing: -0.02em;
        }

        .copy-btn {
            flex: 0 0 auto;
            padding: 8px 10px;
            border-radius: 10px;
            background: var(--copy-bg);
            color: var(--copy-text);
            font: inherit;
            border: 0;
            cursor: pointer;
            font-size: 0.86rem;
            transition: background 0.15s, color 0.15s;
        }

        .copy-btn:hover {
            background: var(--copy-hover);
            color: white;
        }

        .description {
            margin: 0 0 14px;
            color: var(--muted);
            line-height: 1.55;
        }

        .code-block {
            position: relative;
            margin: 10px 0;
            padding: 12px 14px;
            border-radius: 13px;
            background: var(--code-bg);
            overflow-x: auto;
            transition: background 0.2s;
        }

        .code-block small {
            display: block;
            margin-bottom: 6px;
            color: #7dd3fc;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .code-block code {
            color: var(--code-text);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.9rem;
            white-space: pre;
        }

        .options {
            margin-top: 14px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .options summary {
            cursor: pointer;
            font-weight: 700;
            color: var(--secondary);
        }

        .option-list {
            display: grid;
            gap: 10px;
            margin-top: 12px;
        }

        .option-item {
            padding: 11px;
            border-radius: 12px;
            background: var(--option-bg);
            border: 1px solid var(--option-border);
            transition: background 0.2s, border 0.2s;
        }

        .option-name {
            display: inline-block;
            margin-bottom: 5px;
            color: var(--primary-dark);
            font-family: "SFMono-Regular", Consolas, monospace;
            font-weight: 700;
        }

        .option-item p {
            margin: 0 0 7px;
            color: var(--muted);
            line-height: 1.45;
        }

        .option-example {
            display: block;
            padding: 8px 9px;
            border-radius: 9px;
            background: var(--code-bg);
            color: var(--code-text);
            overflow-x: auto;
            font-size: 0.82rem;
        }

        .empty-state {
            text-align: center;
            padding: 70px 20px;
            color: var(--muted);
        }

        .empty-state h3 {
            margin: 0 0 8px;
            color: var(--text);
        }

        .hidden {
            display: none;
        }

        .scroll-top {
            position: fixed;
            right: 22px;
            bottom: 22px;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 999px;
            background: var(--scroll-bg);
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 14px 30px var(--scroll-shadow);
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: 0.2s ease;
        }

        .scroll-top.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* dark-toggle button */
        .theme-toggle {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font: inherit;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
            margin-left: auto;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        /* responsive */
        @media (max-width: 1024px) {
            .commands-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 820px) {
            .commands-grid {
                grid-template-columns: 1fr;
            }
            .toolbar {
                flex-direction: column;
                align-items: flex-start;
            }
            .hero-content {
                align-items: flex-start;
            }
            .theme-toggle {
                margin-left: 0;
            }
        }

        @media (max-width: 640px) {
            .commands-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="hero">
        <div class="hero-content">
            <div class="logo">🐳</div>
            <div>
                <h1>Docker Cheatsheet</h1>
                <p>Fast searchable Docker command reference for daily development.</p>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <span id="themeIcon">🌙</span> <span id="themeLabel">Dark</span>
            </button>
        </div>

        <div class="search-box">
            <input type="search" id="searchInput" placeholder="Search command, syntax, example, description..."
                autocomplete="off" />
        </div>
    </header>

    <main class="container">
        <section class="toolbar">
            <div>
                <h2>Sections</h2>
                <p id="resultCount">Loading commands...</p>
            </div>
            <button id="clearSearchBtn" class="clear-btn">Clear Search</button>
        </section>

        <nav id="categoryButtons" class="category-buttons"></nav>

        <section id="commandsGrid" class="commands-grid"></section>

        <div id="emptyState" class="empty-state hidden">
            <h3>No commands found</h3>
            <p>Try a different keyword or select another section.</p>
        </div>
    </main>

    <button id="scrollTopBtn" class="scroll-top" title="Back to top">↑</button>

            { "category": "Cleanup", "command": "docker system prune", "syntax": "docker system prune [OPTIONS]", "example": "docker system prune --volumes", "description": "Removes unused containers, networks, dangling images, and build cache.", "options": [{ "option": "-a, --all", "description": "Remove all unused images not just dangling", "example": "docker system prune -a" }, { "option": "--filter", "description": "Filter based on conditions", "example": "docker system prune --filter 'until=24h'" }, { "option": "-f, --force", "description": "Do not prompt for confirmation", "example": "docker system prune -f" }, { "option": "--volumes", "description": "Prune volumes as well", "example": "docker system prune --volumes" }, { "option": "--verbose", "description": "Show detailed output", "example": "docker system prune --verbose" }] },
            { "category": "Cleanup", "command": "docker system prune all", "syntax": "docker system prune -a", "example": "docker system prune -a", "description": "Removes all unused images in addition to other unused Docker resources.", "options": [] },
            { "category": "Cleanup", "command": "docker system prune volumes", "syntax": "docker system prune -a --volumes", "example": "docker system prune -a --volumes", "description": "Aggressively removes unused Docker resources, including unused volumes.", "options": [] },
            { "category": "Cleanup", "command": "docker system df", "syntax": "docker system df [OPTIONS]", "example": "docker system df -v", "description": "Shows detailed disk usage breakdown (verbose includes each object).", "options": [{ "option": "--format", "description": "Format output using Go template", "example": "docker system df --format 'table {{.Type}}\t{{.Total}}'" }, { "option": "-v, --verbose", "description": "Show detailed information", "example": "docker system df -v" }] },
            { "category": "Cleanup", "command": "docker builder prune", "syntax": "docker builder prune [OPTIONS]", "example": "docker builder prune -f", "description": "Removes build cache (often the largest space consumer).", "options": [{ "option": "-a, --all", "description": "Remove all build cache", "example": "docker builder prune -a" }, { "option": "--filter", "description": "Filter based on conditions", "example": "docker builder prune --filter 'until=24h'" }, { "option": "-f, --force", "description": "Do not prompt for confirmation", "example": "docker builder prune -f" }, { "option": "--keep-storage", "description": "Amount of disk space to keep", "example": "docker builder prune --keep-storage 10GB" }] },
            { "category": "System", "command": "docker system info", "syntax": "docker system info [OPTIONS]", "example": "docker system info --format '{{.ServerVersion}}'", "description": "Displays system-wide information (same as docker info).", "options": [{ "option": "--format", "description": "Format output using Go template", "example": "docker system info --format '{{.ContainersRunning}}'" }] },
            { "category": "System", "command": "docker system events", "syntax": "docker system events [OPTIONS]", "example": "docker system events --filter 'type=image'", "description": "Streams system-wide Docker events.", "options": [{ "option": "-f, --filter", "description": "Filter output based on conditions", "example": "docker system events --filter 'type=container'" }, { "option": "--format", "description": "Format output", "example": "docker system events --format '{{.Type}} {{.Action}}'" }, { "option": "--since", "description": "Show events since timestamp", "example": "docker system events --since '2023-01-01'" }, { "option": "--until", "description": "Show events until timestamp", "example": "docker system events --until '2023-12-31'" }] },
            { "category": "Advanced", "command": "docker checkpoint", "syntax": "docker checkpoint COMMAND [OPTIONS]", "example": "docker checkpoint create my-app checkpoint1", "description": "Creates/saves container state (experimental).", "options": [] },
            { "category": "Advanced", "command": "docker checkpoint create", "syntax": "docker checkpoint create [OPTIONS] CONTAINER CHECKPOINT_NAME", "example": "docker checkpoint create --leave-running my-app checkpoint1", "description": "Creates a checkpoint of a container.", "options": [{ "option": "--leave-running", "description": "Leave container running after checkpoint", "example": "docker checkpoint create --leave-running my-app cp1" }] },
            { "category": "Advanced", "command": "docker checkpoint ls", "syntax": "docker checkpoint ls CONTAINER", "example": "docker checkpoint ls my-app", "description": "Lists checkpoints for a container.", "options": [] },
            { "category": "Advanced", "command": "docker checkpoint rm", "syntax": "docker checkpoint rm CONTAINER CHECKPOINT_NAME", "example": "docker checkpoint rm my-app checkpoint1", "description": "Removes a container checkpoint.", "options": [] },
            { "category": "Advanced", "command": "docker plugin", "syntax": "docker plugin COMMAND [OPTIONS]", "example": "docker plugin ls --verbose", "description": "Manages Docker plugins (networking, volume, authorization).", "options": [] },
            { "category": "Advanced", "command": "docker plugin install", "syntax": "docker plugin install [OPTIONS] PLUGIN", "example": "docker plugin install --alias sshfs vieux/sshfs", "description": "Installs a Docker plugin.", "options": [{ "option": "--alias", "description": "Alias for the plugin", "example": "docker plugin install --alias my-sshfs vieux/sshfs" }, { "option": "--disable", "description": "Disable plugin after install", "example": "docker plugin install --disable my-plugin" }, { "option": "--grant-all-permissions", "description": "Grant all required permissions", "example": "docker plugin install --grant-all-permissions my-plugin" }] },
            { "category": "Advanced", "command": "docker plugin enable", "syntax": "docker plugin enable [OPTIONS] PLUGIN", "example": "docker plugin enable --timeout 30 my-plugin", "description": "Enables a plugin.", "options": [{ "option": "--timeout", "description": "Timeout for enable operation", "example": "docker plugin enable --timeout 30 my-plugin" }] },
            { "category": "Advanced", "command": "docker plugin disable", "syntax": "docker plugin disable [OPTIONS] PLUGIN", "example": "docker plugin disable --force my-plugin", "description": "Disables a plugin.", "options": [{ "option": "-f, --force", "description": "Force disable", "example": "docker plugin disable -f my-plugin" }] },
            { "category": "Advanced", "command": "docker plugin push", "syntax": "docker plugin push [OPTIONS] PLUGIN", "example": "docker plugin push --disable-content-trust my-plugin", "description": "Pushes a plugin to a registry.", "options": [{ "option": "--disable-content-trust", "description": "Skip image signing", "example": "docker plugin push --disable-content-trust my-plugin" }] },
            { "category": "Advanced", "command": "docker context", "syntax": "docker context COMMAND [OPTIONS]", "example": "docker context create --docker 'host=ssh://user@remote' remote-docker", "description": "Manages Docker contexts for multi-environment.", "options": [] },
            { "category": "Advanced", "command": "docker context create", "syntax": "docker context create [OPTIONS] CONTEXT", "example": "docker context create --docker 'host=ssh://user@host' remote", "description": "Creates a new Docker context.", "options": [{ "option": "--docker", "description": "Docker endpoint configuration", "example": "docker context create --docker host=tcp://192.168.1.100:2376 remote" }, { "option": "--description", "description": "Description of the context", "example": "docker context create --description 'Production cluster' prod" }, { "option": "--from", "description": "Copy from existing context", "example": "docker context create --from default copy" }, { "option": "--kubernetes", "description": "Kubernetes endpoint", "example": "docker context create --kubernetes config-file=kubeconfig prod" }] },
            { "category": "Advanced", "command": "docker context use", "syntax": "docker context use CONTEXT", "example": "docker context use remote-docker", "description": "Switches between Docker contexts.", "options": [] },
            { "category": "Advanced", "command": "docker context ls", "syntax": "docker context ls [OPTIONS]", "example": "docker context ls", "description": "Lists Docker contexts.", "options": [{ "option": "--format", "description": "Format output", "example": "docker context ls --format 'table {{.Name}}\t{{.DockerEndpoint}}'" }, { "option": "-q, --quiet", "description": "Only show names", "example": "docker context ls -q" }] },
            { "category": "Advanced", "command": "docker context inspect", "syntax": "docker context inspect [OPTIONS] CONTEXT [CONTEXT...]", "example": "docker context inspect --format '{{.Metadata.Description}}' prod", "description": "Displays details of a Docker context.", "options": [{ "option": "--format", "description": "Format output using Go template", "example": "docker context inspect -f '{{.Name}}' prod" }] },
            { "category": "Advanced", "command": "docker context rm", "syntax": "docker context rm [OPTIONS] CONTEXT [CONTEXT...]", "example": "docker context rm -f remote", "description": "Removes one or more Docker contexts.", "options": [{ "option": "-f, --force", "description": "Force removal", "example": "docker context rm -f my-context" }] },
            { "category": "Advanced", "command": "docker swarm", "syntax": "docker swarm COMMAND [OPTIONS]", "example": "docker swarm init --advertise-addr 192.168.1.1", "description": "Initializes/joins/manages Docker Swarm cluster.", "options": [] },
            { "category": "Advanced", "command": "docker swarm init", "syntax": "docker swarm init [OPTIONS]", "example": "docker swarm init --advertise-addr eth0 --listen-addr eth0:2377", "description": "Initializes a swarm cluster.", "options": [{ "option": "--advertise-addr", "description": "Advertised address for node discovery", "example": "docker swarm init --advertise-addr 192.168.1.1" }, { "option": "--listen-addr", "description": "Listen address (default 0.0.0.0:2377)", "example": "docker swarm init --listen-addr eth0:2377" }, { "option": "--force-new-cluster", "description": "Force creating a new cluster", "example": "docker swarm init --force-new-cluster" }, { "option": "--data-path-addr", "description": "Address for data path", "example": "docker swarm init --data-path-addr 192.168.1.1" }] },
            { "category": "Advanced", "command": "docker node", "syntax": "docker node COMMAND [OPTIONS]", "example": "docker node ls", "description": "Manages Swarm nodes.", "options": [] },
            { "category": "Advanced", "command": "docker node ls", "syntax": "docker node ls [OPTIONS]", "example": "docker node ls --filter 'node.role=manager'", "description": "Lists nodes in the Swarm cluster.", "options": [{ "option": "-f, --filter", "description": "Filter based on conditions", "example": "docker node ls --filter 'node.role=worker'" }, { "option": "--format", "description": "Format output", "example": "docker node ls --format 'table {{.Hostname}}\t{{.Status}}'" }] },
            { "category": "Advanced", "command": "docker service", "syntax": "docker service COMMAND [OPTIONS]", "example": "docker service create --replicas 3 --name web nginx", "description": "Manages Swarm services (deployments).", "options": [] },
            { "category": "Advanced", "command": "docker service create", "syntax": "docker service create [OPTIONS] IMAGE [COMMAND]", "example": "docker service create --replicas 3 --publish 80:80 --name web nginx", "description": "Creates a service in Swarm cluster.", "options": [{ "option": "--replicas", "description": "Number of replicas", "example": "docker service create --replicas 5 nginx" }, { "option": "--publish", "description": "Publish ports", "example": "docker service create --publish 80:80 nginx" }, { "option": "--env", "description": "Environment variables", "example": "docker service create --env DEBUG=true nginx" }, { "option": "--name", "description": "Service name", "example": "docker service create --name web nginx" }] },
            { "category": "Advanced", "command": "docker stack", "syntax": "docker stack COMMAND [OPTIONS]", "example": "docker stack deploy --compose-file docker-compose.yml my-stack", "description": "Deploys a stack to Swarm using Compose file.", "options": [] },
            { "category": "Advanced", "command": "docker stack deploy", "syntax": "docker stack deploy [OPTIONS] NAME", "example": "docker stack deploy --compose-file prod-compose.yml prod", "description": "Deploys a new stack or updates an existing one.", "options": [{ "option": "--compose-file, -c", "description": "Compose file to use", "example": "docker stack deploy -c docker-compose.yml prod" }, { "option": "--prune", "description": "Prune services not in compose file", "example": "docker stack deploy --prune prod" }, { "option": "--resolve-image", "description": "Resolve image digests", "example": "docker stack deploy --resolve-image always prod" }, { "option": "--with-registry-auth", "description": "Send registry auth details", "example": "docker stack deploy --with-registry-auth prod" }] },
            { "category": "Advanced", "command": "docker stack ps", "syntax": "docker stack ps [OPTIONS] NAME", "example": "docker stack ps --no-trunc prod", "description": "Lists tasks in the stack.", "options": [{ "option": "-f, --filter", "description": "Filter output", "example": "docker stack ps --filter 'desired-state=running' prod" }, { "option": "--format", "description": "Format output", "example": "docker stack ps --format 'table {{.Name}}\t{{.Error}}' prod" }, { "option": "--no-trunc", "description": "Don't truncate output", "example": "docker stack ps --no-trunc prod" }] },
            { "category": "Advanced", "command": "docker stack rm", "syntax": "docker stack rm [OPTIONS] NAME", "example": "docker stack rm prod", "description": "Removes the stack from Swarm.", "options": [{ "option": "--keep", "description": "Keep services after removal", "example": "docker stack rm --keep prod" }] },
            { "category": "Advanced", "command": "docker stack services", "syntax": "docker stack services [OPTIONS] NAME", "example": "docker stack services prod", "description": "Lists services in the stack.", "options": [{ "option": "-f, --filter", "description": "Filter output", "example": "docker stack services --filter 'label=type=web' prod" }, { "option": "--format", "description": "Format output", "example": "docker stack services --format 'table {{.Name}}\t{{.Replicas}}' prod" }] },
            { "category": "Advanced", "command": "docker stack ls", "syntax": "docker stack ls [OPTIONS]", "example": "docker stack ls", "description": "Lists all stacks in Swarm.", "options": [{ "option": "--format", "description": "Format output", "example": "docker stack ls --format 'table {{.Name}}\t{{.Services}}'" }] }
        ];

        // ========== UI LOGIC ==========
        const commandsGrid = document.getElementById("commandsGrid");
        const categoryButtons = document.getElementById("categoryButtons");
        const searchInput = document.getElementById("searchInput");
        const resultCount = document.getElementById("resultCount");
        const emptyState = document.getElementById("emptyState");
        const clearSearchBtn = document.getElementById("clearSearchBtn");
        const scrollTopBtn = document.getElementById("scrollTopBtn");
        const themeToggle = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");
        const themeLabel = document.getElementById("themeLabel");

        let activeCategory = "All";
        let currentTheme = "light"; // 'light' or 'dark'

        // ----- theme management -----
        function applyTheme(theme) {
            currentTheme = theme;
            if (theme === "dark") {
                document.documentElement.setAttribute("data-theme", "dark");
                themeIcon.textContent = "☀️";
                themeLabel.textContent = "Light";
            } else {
                document.documentElement.removeAttribute("data-theme");
                themeIcon.textContent = "🌙";
                themeLabel.textContent = "Dark";
            }
            // persist preference
            localStorage.setItem("docker-cheatsheet-theme", theme);
        }

        function toggleTheme() {
            const next = currentTheme === "light" ? "dark" : "light";
            applyTheme(next);
        }

        // load saved theme
        const savedTheme = localStorage.getItem("docker-cheatsheet-theme");
        if (savedTheme === "dark") {
            applyTheme("dark");
        } else {
            applyTheme("light");
        }

        themeToggle.addEventListener("click", toggleTheme);

        // ----- render functions (unchanged) -----
        function getCategories() {
            const categories = docker_commands.map((item) => item.category);
            return ["All", ...new Set(categories)];
        }

        function escapeHTML(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function getSearchText(commandItem) {
            const optionsText = commandItem.options
                .map((opt) => `${opt.option} ${opt.description} ${opt.example}`)
                .join(" ");
            return `
    ${commandItem.category}
    ${commandItem.command}
    ${commandItem.syntax}
    ${commandItem.example}
    ${commandItem.description}
    ${optionsText}
  `.toLowerCase();
        }

        function filterCommands() {
            const searchValue = searchInput.value.trim().toLowerCase();
            return docker_commands.filter((item) => {
                const matchesCategory =
                    activeCategory === "All" || item.category === activeCategory;
                const matchesSearch =
                    !searchValue || getSearchText(item).includes(searchValue);
                return matchesCategory && matchesSearch;
            });
        }

        function renderCategoryButtons() {
            const categories = getCategories();
            categoryButtons.innerHTML = categories
                .map((category) => {
                    const isActive = category === activeCategory ? "active" : "";
                    const count =
                        category === "All"
                            ? docker_commands.length
                            : docker_commands.filter((item) => item.category === category).length;
                    return `
        <button class="category-btn ${isActive}" data-category="${escapeHTML(category)}">
          ${escapeHTML(category)} (${count})
        </button>
      `;
                })
                .join("");
        }

        function renderCommands() {
            const filteredCommands = filterCommands();
            resultCount.textContent = `${filteredCommands.length} of ${docker_commands.length} commands shown`;
            emptyState.classList.toggle("hidden", filteredCommands.length > 0);
            commandsGrid.innerHTML = filteredCommands
                .map((item) => {
                    const optionsHTML = item.options.length ?
                        `
          <details class="options">
            <summary>Options (${item.options.length})</summary>
            <div class="option-list">
              ${item.options.map(opt => `
                    <div class="option-item">
                      <span class="option-name">${escapeHTML(opt.option)}</span>
                      <p>${escapeHTML(opt.description)}</p>
                      <code class="option-example">${escapeHTML(opt.example)}</code>
                    </div>
                  `).join("")}
            </div>
          </details>
        ` :
                        "";
                    return `
        <article class="command-card">
          <div class="card-top">
            <div>
              <span class="badge">${escapeHTML(item.category)}</span>
              <h3>${escapeHTML(item.command)}</h3>
            </div>
            <button class="copy-btn" data-copy="${escapeHTML(item.example)}" title="Copy example command">Copy</button>
          </div>
          <p class="description">${escapeHTML(item.description)}</p>
          <div class="code-block"><small>Syntax</small><code>${escapeHTML(item.syntax)}</code></div>
          <div class="code-block"><small>Example</small><code>${escapeHTML(item.example)}</code></div>
          ${optionsHTML}
        </article>
      `;
                })
                .join("");
        }

        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const oldText = button.textContent;
                button.textContent = "Copied";
                setTimeout(() => { button.textContent = oldText; }, 1100);
            }).catch(() => { alert("Unable to copy command."); });
        }

        // ----- event listeners -----
        categoryButtons.addEventListener("click", (event) => {
            const button = event.target.closest(".category-btn");
            if (!button) return;
            activeCategory = button.dataset.category;
            renderCategoryButtons();
            renderCommands();
        });

        commandsGrid.addEventListener("click", (event) => {
            const button = event.target.closest(".copy-btn");
            if (!button) return;
            copyToClipboard(button.dataset.copy, button);
        });

        searchInput.addEventListener("input", renderCommands);

        clearSearchBtn.addEventListener("click", () => {
            searchInput.value = "";
            activeCategory = "All";
            renderCategoryButtons();
            renderCommands();
            searchInput.focus();
        });

        window.addEventListener("scroll", () => {
            scrollTopBtn.classList.toggle("show", window.scrollY > 500);
        });

        scrollTopBtn.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        // ----- initial render -----
        renderCategoryButtons();
        renderCommands();
    </script>
</body>

</html>
