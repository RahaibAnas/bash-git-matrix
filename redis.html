<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redis CLI · cheatsheet</title>
    <!-- Font & minimal icons (feather) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* header */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            border-bottom: 1px solid #30363d;
            padding-bottom: 1.25rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-area i {
            font-size: 2rem;
            color: #dc382d;
        }

        .logo-area h1 {
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0883e, #dc382d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-wrap {
            display: flex;
            align-items: center;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 40px;
            padding: 0.35rem 0.35rem 0.35rem 1.2rem;
            transition: 0.2s;
            min-width: 240px;
        }

        .search-wrap:focus-within {
            border-color: #f0883e;
            box-shadow: 0 0 0 3px rgba(240, 136, 62, 0.15);
        }

        .search-wrap i {
            color: #8b949e;
            font-size: 0.9rem;
        }

        .search-wrap input {
            background: transparent;
            border: none;
            padding: 0.5rem 0.5rem 0.5rem 0.7rem;
            color: #e6edf3;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
        }

        .search-wrap input::placeholder {
            color: #484f58;
        }

        .search-wrap button {
            background: #238636;
            border: none;
            color: white;
            font-weight: 500;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }

        .search-wrap button:hover {
            background: #2ea043;
        }

        /* category pills */
        .category-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 0.6rem;
            margin-bottom: 2.2rem;
            padding: 0.25rem 0;
        }

        .cat-btn {
            background: transparent;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 0.4rem 1.1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        .cat-btn:hover {
            background: #21262d;
            color: #e6edf3;
            border-color: #484f58;
        }

        .cat-btn.active {
            background: #dc382d;
            border-color: #dc382d;
            color: white;
        }

        .cat-btn.active:hover {
            background: #f03a2f;
        }

        /* command grid */
        .command-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.25rem;
        }

        .cmd-card {
            background: #161b22;
            border: 3px solid #30363d;
            border-radius: 16px;
            padding: 1rem 1.2rem 1.2rem;
            transition: 0.12s;
            display: flex;
            flex-direction: column;
        }

        .cmd-card:hover {
            border-color: #650000;
            background: #1c2128;
        }

        .cmd-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }

        .cmd-name {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-weight: 600;
            font-size: 1rem;
            color: #f0e6d0;
            background: #21262d;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
            letter-spacing: -0.01em;
            border: 1px solid #2d333b;
        }

        .cmd-section {
            font-size: 0.7rem;
            background: #0d1117;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            color: #8b949e;
            border: 1px solid #21262d;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .cmd-syntax {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            background: #0d1117;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #b1bac4;
            border-left: 5px solid #8d1d15;
            margin: 0.5rem 0 0.6rem;
            word-break: break-all;
            line-height: 1.4;
        }

        .cmd-example {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            background: #0d1117;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #8b949e;
            border: 1px dashed #2d333b;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: flex-start;
            gap: 0.3rem;
        }

        .cmd-example i {
            color: #f0883e;
            font-size: 0.7rem;
            margin-top: 0.15rem;
        }

        .cmd-example span {
            color: #c9d1d9;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 0;
            color: #8b949e;
            background: #161b22;
            border-radius: 30px;
            border: 1px dashed #30363d;
        }

        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #484f58;
            text-align: center;
            border-top: 1px solid #21262d;
            padding-top: 1.8rem;
        }

        /* responsive */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.8rem;
            }

            .search-wrap {
                min-width: unset;
                width: 100%;
            }

            .command-grid {
                grid-template-columns: 1fr;
            }

            .cat-btn {
                font-size: 0.7rem;
                padding: 0.3rem 0.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo-area">
                <i class="fab fa-redis"></i>
                <h1>redis · cheatsheet</h1>
            </div>
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="search commands, syntax...">
                <button id="clearSearchBtn"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <!-- category filter buttons -->
        <div class="category-bar" id="categoryBar"></div>

        <!-- command cards grid -->
        <div class="command-grid" id="commandGrid"></div>
        <div class="footer-note">
            <i class="fas fa-terminal" style="margin-right: 6px;"></i> Redis CLI · server & client commands
            <span
                style="margin-left: 20px; background: #21262d; padding: 0.2rem 0.8rem; border-radius: 20px; font-size: 0.75rem; border: 1px solid #30363d;">
                <i class="fas fa-database" style="margin-right: 4px;"></i>
                <span id="commandCount">0</span> commands
            </span>
        </div>
    </div>

    <script>
        (function () {

            // --------------------------------------------------------------
            const sections = [

                { id: 'hashes', label: 'Hashes' },

                { id: 'sorted', label: 'Sorted Sets' },
                { id: 'streams', label: 'Streams' },
                { id: 'pubsub', label: 'Pub/Sub' },
                { id: 'transactions', label: 'Transactions' },
                { id: 'lua', label: 'Lua Scripts' },

                { id: 'config', label: 'Connection/Config' },
                { id: 'memory', label: 'Memory' },
                { id: 'monitor', label: 'Monitoring' },
                { id: 'persist', label: 'Persistence' },
                { id: 'replication', label: 'Replication' },
                { id: 'sentinel', label: 'Sentinel' },
                { id: 'cluster', label: 'Cluster' },
                { id: 'acl', label: 'ACL / Security' },
                { id: 'patterns', label: 'Backend Patterns' },
                { id: 'reference', label: 'Reference' }

            // flattened command list with section reference
            const commands = [
                // ==================== SERVER & CLI ====================
                { section: 'server', name: 'redis-server', syntax: 'redis-server [options]', example: 'redis-server --port 6379' },
                { section: 'server', name: 'redis-server --version', syntax: 'redis-server --version', example: 'redis-server --version' },
                { section: 'server', name: 'redis-cli', syntax: 'redis-cli [options]', example: 'redis-cli -h 127.0.0.1 -p 6379' },
                { section: 'server', name: 'redis-cli -h', syntax: 'redis-cli -h <host>', example: 'redis-cli -h localhost' },
                { section: 'server', name: 'redis-cli -p', syntax: 'redis-cli -p <port>', example: 'redis-cli -p 6380' },
                { section: 'server', name: 'redis-cli -a', syntax: 'redis-cli -a <password>', example: 'redis-cli -a mysecret' },

                { section: 'server', name: 'INFO', syntax: 'INFO [section]', example: 'INFO memory' },
                { section: 'server', name: 'INFO server', syntax: 'INFO server', example: 'INFO server' },
                { section: 'server', name: 'INFO memory', syntax: 'INFO memory', example: 'INFO memory' },
                { section: 'server', name: 'INFO clients', syntax: 'INFO clients', example: 'INFO clients' },
                { section: 'server', name: 'INFO stats', syntax: 'INFO stats', example: 'INFO stats' },
                { section: 'server', name: 'INFO replication', syntax: 'INFO replication', example: 'INFO replication' },

                // ==================== KEYS ====================
                { section: 'keys', name: 'SET', syntax: 'SET key value [options]', example: 'SET user:1 "Alice"' },
                { section: 'keys', name: 'GET', syntax: 'GET key', example: 'GET user:1' },
                { section: 'keys', name: 'EXISTS', syntax: 'EXISTS key [key ...]', example: 'EXISTS user:1' },
                { section: 'keys', name: 'DEL', syntax: 'DEL key [key ...]', example: 'DEL user:1' },
                { section: 'keys', name: 'UNLINK', syntax: 'UNLINK key [key ...]', example: 'UNLINK cache:large' },
                { section: 'keys', name: 'TYPE', syntax: 'TYPE key', example: 'TYPE user:1' },
                { section: 'keys', name: 'RENAME', syntax: 'RENAME key newkey', example: 'RENAME old:name new:name' },
                { section: 'keys', name: 'RENAMENX', syntax: 'RENAMENX key newkey', example: 'RENAMENX temp:data final:data' },
                { section: 'keys', name: 'RANDOMKEY', syntax: 'RANDOMKEY', example: 'RANDOMKEY' },
                { section: 'keys', name: 'KEYS', syntax: 'KEYS pattern', example: 'KEYS user:*' },
                { section: 'keys', name: 'SCAN', syntax: 'SCAN cursor [MATCH pattern] [COUNT count]', example: 'SCAN 0 MATCH user:*' },
                { section: 'keys', name: 'OBJECT', syntax: 'OBJECT subcommand key', example: 'OBJECT ENCODING user:1' },
                { section: 'keys', name: 'MEMORY USAGE', syntax: 'MEMORY USAGE key [SAMPLES n]', example: 'MEMORY USAGE user:1' },
                { section: 'keys', name: 'TTL', syntax: 'TTL key', example: 'TTL session:123' },
                { section: 'keys', name: 'PTTL', syntax: 'PTTL key', example: 'PTTL session:123' },

                // ==================== EXPIRATION ====================
                { section: 'expire', name: 'EXPIRE', syntax: 'EXPIRE key seconds', example: 'EXPIRE session:123 3600' },
                { section: 'expire', name: 'PEXPIRE', syntax: 'PEXPIRE key milliseconds', example: 'PEXPIRE temp 5000' },
                { section: 'expire', name: 'EXPIREAT', syntax: 'EXPIREAT key timestamp', example: 'EXPIREAT otp 1672531200' },
                { section: 'expire', name: 'PEXPIREAT', syntax: 'PEXPIREAT key timestamp_ms', example: 'PEXPIREAT cache 1672531200000' },
                { section: 'expire', name: 'TTL', syntax: 'TTL key', example: 'TTL session:123' },
                { section: 'expire', name: 'PTTL', syntax: 'PTTL key', example: 'PTTL session:123' },
                { section: 'expire', name: 'PERSIST', syntax: 'PERSIST key', example: 'PERSIST session:123' },

                // ==================== STRINGS ====================
                { section: 'strings', name: 'SET', syntax: 'SET key value [NX|XX] [EX|PX|EXAT|PXAT] [KEEPTTL]', example: 'SET counter 0 EX 10' },
                { section: 'strings', name: 'GET', syntax: 'GET key', example: 'GET counter' },
                { section: 'strings', name: 'MSET', syntax: 'MSET key value [key value ...]', example: 'MSET a 1 b 2' },
                { section: 'strings', name: 'MGET', syntax: 'MGET key [key ...]', example: 'MGET a b' },
                { section: 'strings', name: 'SETNX', syntax: 'SETNX key value', example: 'SETNX lock "acquired"' },
                { section: 'strings', name: 'GETSET', syntax: 'GETSET key value', example: 'GETSET counter 0' },
                { section: 'strings', name: 'APPEND', syntax: 'APPEND key value', example: 'APPEND log "new line"' },

                { section: 'strings', name: 'MSETNX', syntax: 'MSETNX key value [key value ...]', example: 'MSETNX a 1 b 2' },

                // ==================== HASHES ====================
                { section: 'hashes', name: 'HSET', syntax: 'HSET key field value [field value ...]', example: 'HSET user:2 name "Bob" age 30' },
                { section: 'hashes', name: 'HMSET', syntax: 'HMSET key field value [field value ...]', example: 'HMSET user:3 name "Charlie" age 25' },
                { section: 'hashes', name: 'HGET', syntax: 'HGET key field', example: 'HGET user:2 name' },
                { section: 'hashes', name: 'HMGET', syntax: 'HMGET key field [field ...]', example: 'HMGET user:2 name age' },
                { section: 'hashes', name: 'HGETALL', syntax: 'HGETALL key', example: 'HGETALL user:2' },
                { section: 'hashes', name: 'HKEYS', syntax: 'HKEYS key', example: 'HKEYS user:2' },
                { section: 'hashes', name: 'HVALS', syntax: 'HVALS key', example: 'HVALS user:2' },
                { section: 'hashes', name: 'HLEN', syntax: 'HLEN key', example: 'HLEN user:2' },
                { section: 'hashes', name: 'HEXISTS', syntax: 'HEXISTS key field', example: 'HEXISTS user:2 age' },
                { section: 'hashes', name: 'HDEL', syntax: 'HDEL key field [field ...]', example: 'HDEL user:2 age' },
                { section: 'hashes', name: 'HINCRBY', syntax: 'HINCRBY key field increment', example: 'HINCRBY user:2 score 5' },
                { section: 'hashes', name: 'HINCRBYFLOAT', syntax: 'HINCRBYFLOAT key field increment', example: 'HINCRBYFLOAT user:2 balance 10.50' },
                { section: 'hashes', name: 'HRANDFIELD', syntax: 'HRANDFIELD key [count] [WITHVALUES]', example: 'HRANDFIELD user:2 2 WITHVALUES' },

                // ==================== LISTS ====================
                { section: 'lists', name: 'LPUSH', syntax: 'LPUSH key value [value ...]', example: 'LPUSH tasks "task1"' },
                { section: 'lists', name: 'RPUSH', syntax: 'RPUSH key value [value ...]', example: 'RPUSH tasks "task2"' },
                { section: 'lists', name: 'LPUSHX', syntax: 'LPUSHX key value', example: 'LPUSHX existing-list "new"' },
                { section: 'lists', name: 'RPUSHX', syntax: 'RPUSHX key value', example: 'RPUSHX existing-list "new"' },
                { section: 'lists', name: 'LPOP', syntax: 'LPOP key [count]', example: 'LPOP tasks' },
                { section: 'lists', name: 'RPOP', syntax: 'RPOP key [count]', example: 'RPOP tasks' },
                { section: 'lists', name: 'LREM', syntax: 'LREM key count element', example: 'LREM tasks 2 "old-task"' },

            // Function to count and display total commands
            // Function to count and display commands (with filtering support)
            function updateCommandCount() {
                const searchTerm = searchInput.value.trim().toLowerCase();
                let filtered = commands;

                // Apply category filter
                if (activeCategory !== 'all') {
                    filtered = filtered.filter(cmd => cmd.section === activeCategory);
                }

                // Apply search filter
                if (searchTerm) {
                    filtered = filtered.filter(cmd => {
                        return cmd.name.toLowerCase().includes(searchTerm) ||
                            cmd.syntax.toLowerCase().includes(searchTerm) ||
                            cmd.example.toLowerCase().includes(searchTerm);
                    });
                }

                const total = filtered.length;
                const totalAll = commands.length;
                const countDisplay = document.getElementById('commandCount');

                if (countDisplay) {
                    // Show filtered count and total
                    if (searchTerm || activeCategory !== 'all') {
                        countDisplay.innerHTML = `${total} / ${totalAll}`;
                    } else {
                        countDisplay.textContent = totalAll;
                    }
                }
            }

            // Call this function after rendering commands
            // Add this line inside your renderCommands() function, right before the closing }
            // or call it after initial render

            // DOM elements
            const grid = document.getElementById('commandGrid');
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearchBtn');
            const categoryBar = document.getElementById('categoryBar');

            let activeCategory = 'all';

            // render category buttons
            function renderCategories() {
                let html = `<button class="cat-btn active" data-cat="all">All</button>`;
                sections.forEach(s => {
                    html += `<button class="cat-btn" data-cat="${s.id}">${s.label}</button>`;
                });
                categoryBar.innerHTML = html;
                // attach events
                document.querySelectorAll('.cat-btn').forEach(btn => {
                    btn.addEventListener('click', function (e) {
                        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        activeCategory = this.dataset.cat;
                        renderCommands();
                        updateCommandCount();
                    });
                });
            }

            // render command cards based on filter + search
            function renderCommands() {
                const searchTerm = searchInput.value.trim().toLowerCase();
                let filtered = commands;

                // category filter
                if (activeCategory !== 'all') {
                    filtered = filtered.filter(cmd => cmd.section === activeCategory);
                }

                // search filter (name, syntax, example)
                if (searchTerm) {
                    filtered = filtered.filter(cmd => {
                        return cmd.name.toLowerCase().includes(searchTerm) ||
                            cmd.syntax.toLowerCase().includes(searchTerm) ||
                            cmd.example.toLowerCase().includes(searchTerm);
                    });
                }

                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="no-results"><i class="fas fa-search" style="margin-right: 8px;"></i> no commands found</div>`;
                    return;
                }

                let cards = '';
                filtered.forEach(cmd => {
                    const sectionLabel = sections.find(s => s.id === cmd.section)?.label || cmd.section;
                    cards += `
          <div class="cmd-card">
            <div class="cmd-header">
              <span class="cmd-name">${cmd.name}</span>
              <span class="cmd-section">${sectionLabel}</span>
            </div>
            <div class="cmd-syntax">${cmd.syntax}</div>
            <div class="cmd-example"><i class="fas fa-code"></i><span>${cmd.example}</span></div>
          </div>
        `;
                });
                grid.innerHTML = cards;
                updateCommandCount(); // Add this line
            }

            // search input handler
            searchInput.addEventListener('input', renderCommands);
            clearBtn.addEventListener('click', function () {
                searchInput.value = '';
                renderCommands();
            });

            // initial render
            renderCategories();
            renderCommands();
            updateCommandCount(); // Add this line
        })();
